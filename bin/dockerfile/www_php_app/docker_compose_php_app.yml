version: '3.8'

services:
  php-app:
    build: .
    container_name: php-nginx-app
    restart: unless-stopped
    ports:
      - "8001:80"
      - "8443:443"  # If you plan to add SSL later
    volumes:
      # Mount host directory to container web root
      - /data/wwwapp/var/www/htdocs:/var/www/htdocs
      # Optional: Mount custom configs (uncomment if needed)
      # - ./nginx-custom.conf:/etc/nginx/conf.d/default.conf
      # - ./php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
      # Mount logs to host (optional)
      - ./logs/nginx:/var/log/nginx
      - ./logs/php:/var/log/php
      - ./logs/supervisor:/var/log/supervisor
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=300
      - PHP_UPLOAD_MAX_FILESIZE=50M
      - NGINX_WORKER_PROCESSES=auto
    networks:
      - php-network
    healthcheck:
      test: ["/usr/local/bin/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  php-network:
    driver: bridge

