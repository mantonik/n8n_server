# Nginx configuration for n8n and URL Check
# version block ( keep and add new version on every change)
# ver: 6/29/2025 Gemini
# ver: update 4
# ver: update 5.1
########################################

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_disable "msie6";

    # Basic Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    server {
        listen 80;
        listen [::]:80;
        server_name _;  # Catch-all server name

        # Serve n8n on the root domain
        location /  {
            proxy_pass http://127.0.0.1:5678/;  # Use 127.0.0.1 for clarity, add trailing slash
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;  # Pass the client's IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Add buffer settings for better performance (optional)
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Serve URL Check application
        location /urlcheck-v1  {
            alias /var/www/html;  # Assuming your URL Check app is in /var/www/html
            index index.php index.html;

            try_files $uri $uri/ /index.php?$args;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;  # Assuming PHP-FPM runs on port 9000
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename;
            }

            # Static files
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf)$ {
                expires 30d;
                add_header Cache-Control public;
                try_files $uri =404;
            }
        }

        # Handle requests for /urlcheck-v1/ or anything else not explicitly defined
        location ~ ^/(?!urlcheck-v1/).*$  {
            root /var/www/html;  # Serve from /var/www/html
            try_files $uri $uri/ /index.php?$args;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            }

            # Static files
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf)$ {
                expires 30d;
                add_header Cache-Control public;
                try_files $uri =404;
            }
        }

        # Error handling
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        # Redirect server errors to a simple page
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Security: Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}