# /etc/nginx/nginx.conf
# Complete Nginx configuration for URL Check PHP application

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Load dynamic modules if available
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # MIME Types - CRITICAL for CSS/JS files
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Additional MIME types for common web files
    location ~* \.(css)$ {
        add_header Content-Type text/css;
    }
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Server configuration for URL Check application
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Document root for PHP application
        root /var/www/html;
        index index.php index.html index.htm;

        # Main location for urlcheck-v1 application
        location /urlcheck-v1/ {
            alias /var/www/html/;
            try_files $uri $uri/ @php_urlcheck;
            
            # Handle PHP files in urlcheck-v1
            location ~ ^/urlcheck-v1/(.+\.php)$ {
                alias /var/www/html/;
                try_files /$1 =404;
                
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/html/$1;
                fastcgi_param SCRIPT_NAME /urlcheck-v1/$1;
                fastcgi_param REQUEST_URI $uri;
                fastcgi_param DOCUMENT_URI $uri;
                fastcgi_param DOCUMENT_ROOT /var/www/html;
                include fastcgi_params;
                
                # PHP specific settings
                fastcgi_read_timeout 300;
                fastcgi_buffer_size 128k;
                fastcgi_buffers 4 256k;
                fastcgi_busy_buffers_size 256k;
            }
            
            # Static files (CSS, JS, images) - CRITICAL for MIME types
            location ~* ^/urlcheck-v1/.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
                alias /var/www/html/;
                try_files $uri =404;
                
                # Proper MIME type handling
                location ~* \.css$ {
                    add_header Content-Type text/css;
                    add_header Cache-Control "public, max-age=31536000";
                }
                
                location ~* \.js$ {
                    add_header Content-Type application/javascript;
                    add_header Cache-Control "public, max-age=31536000";
                }
                
                location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
                    add_header Cache-Control "public, max-age=31536000";
                }
                
                location ~* \.(woff|woff2|ttf|eot|otf)$ {
                    add_header Cache-Control "public, max-age=31536000";
                    add_header Access-Control-Allow-Origin "*";
                }
                
                # No access logs for static files
                access_log off;
                log_not_found off;
            }
        }
        
        # Fallback for PHP processing
        location @php_urlcheck {
            rewrite ^/urlcheck-v1/(.*)$ /index.php?url=$1 last;
        }
        
        # Root location (if accessed without urlcheck-v1)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        # Global PHP handler
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }
        
        # Security: Deny access to sensitive files
        location ~ /\.ht {
            deny all;
        }
        
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ composer\.(json|lock) {
            deny all;
        }
        
        location ~ package\.json {
            deny all;
        }
        
        location ~ \.env {
            deny all;
        }
        
        # Favicon and robots
        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }
        
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }
        
        # Health check endpoints
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location = /ping {
            access_log off;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
        
        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # Include additional server configurations
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

# Additional configurations can be included here