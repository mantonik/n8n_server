# Production nginx.conf for URLCheck Dashboard + N8N
# Author: Generated for dmseo03.dmcloudarchitect.com
# Date: 2025-01-18
# Purpose: Serves both N8N workflow automation and URLCheck monitoring dashboard

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Load dynamic modules
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # MIME Types and Logging
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$request_time" "$upstream_response_time"';

    log_format urlcheck '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "URLCheck Dashboard"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimizations
    sendfile                on;
    tcp_nopush             on;
    tcp_nodelay            on;
    keepalive_timeout      65;
    keepalive_requests     100;
    client_max_body_size   100M;
    client_body_timeout    60s;
    client_header_timeout  60s;
    send_timeout           60s;
    
    # Hash Settings
    types_hash_max_size    2048;
    server_names_hash_bucket_size 128;
    
    # Buffer Settings
    client_body_buffer_size    128k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 4k;
    output_buffers             1 32k;
    postpone_output            1460;

    # Gzip Compression
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1000;
    gzip_comp_level     6;
    gzip_http_version   1.1;
    gzip_proxied        any;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;

    # Main Server Block
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  dmseo03.dmcloudarchitect.com _;
        root         /data/nginx/html;
        index        index.php index.html index.htm;

        # Security Headers (Global)
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        
        # Hide server information
        server_tokens off;

        # Include additional server configurations
        include /etc/nginx/default.d/*.conf;

        # =================================================================
        # URLCHECK DASHBOARD - PROXY ALL REQUESTS TO PODMAN CONTAINER
        # =================================================================
        
        # ALL URLCHECK REQUESTS - Single location block to handle everything
        location /urlcheck/ {
            # Access logging for URLCheck
            access_log /var/log/nginx/urlcheck.log urlcheck;
            
            # Rate limiting based on request type
            # Enhanced rate limiting for login
            if ($request_uri ~ "^/urlcheck/login\.php") {
                set $rate_limit_zone "login";
            }
            # Higher rate limit for API calls  
            if ($request_uri ~ "^/urlcheck/(api|ajax)/") {
                set $rate_limit_zone "api";
            }
            # Default rate limiting
            if ($rate_limit_zone = "") {
                set $rate_limit_zone "general";
            }
            
            # Apply rate limiting (simplified approach)
            limit_req zone=general burst=20 nodelay;
            
            # Proxy ALL requests to Podman container running on localhost:8001
            proxy_pass http://127.0.0.1:8001;
            
            # Headers for proxy
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_set_header X-Forwarded-Host    $host;
            proxy_set_header X-Forwarded-Port    $server_port;
            
            # For handling redirects properly
            proxy_set_header X-Original-URI      $request_uri;
            proxy_set_header X-Original-URL      $scheme://$host$request_uri;
            
            # Proxy timeouts
            proxy_connect_timeout    30s;
            proxy_send_timeout       30s;
            proxy_read_timeout       30s;
            proxy_redirect           off;
            
            # Buffering settings - optimized for static assets and PHP
            proxy_buffer_size        128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size  256k;
            proxy_temp_file_write_size 256k;
            proxy_buffering          on;
            
            # Dashboard-specific security headers
            proxy_hide_header X-Powered-By;
            add_header X-Frame-Options           "SAMEORIGIN" always;
            add_header Content-Security-Policy   "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header X-XSS-Protection          "1; mode=block" always;
            
            # Handle errors from upstream
            proxy_intercept_errors   off;
            
            # Allow all file types to be proxied
            # This ensures .php, .css, .js, .html, images, etc. all go to backend
        }

        # Handle root URLCheck redirect (optional - redirect /urlcheck to /urlcheck/)
        location = /urlcheck {
            return 301 $scheme://$host/urlcheck/;
        }

        # =================================================================
        # N8N WORKFLOW AUTOMATION PLATFORM
        # =================================================================
        location / {
            # Rate limiting for N8N
            limit_req zone=general burst=50 nodelay;
            
            # Proxy to N8N instance
            proxy_pass http://127.0.0.1:5678;
            
            # Headers for Load Balancer -> Nginx -> N8N setup
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   https;  # LB terminates SSL
            proxy_set_header X-Forwarded-Host    $host;
            proxy_set_header X-Forwarded-Port    443;
            
            # WebSocket Support for N8N
            proxy_set_header Upgrade             $http_upgrade;
            proxy_set_header Connection          "upgrade";
            proxy_http_version 1.1;
            
            # Proxy Timeouts
            proxy_connect_timeout    60s;
            proxy_send_timeout       60s;
            proxy_read_timeout       60s;
            proxy_redirect           off;
            
            # Buffering Settings (optimized for WebSockets)
            proxy_buffer_size        128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size  256k;
            proxy_temp_file_write_size 256k;
            proxy_buffering          off;
            proxy_cache              off;
            
            # Additional headers for N8N functionality
            proxy_set_header X-Scheme            $scheme;
            proxy_set_header X-Request-ID        $request_id;
        }

        # =================================================================
        # SSL/TLS CERTIFICATE MANAGEMENT
        # =================================================================
        # Let's Encrypt ACME Challenge
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /data/nginx/letsencrypt;
            allow all;
        }
        
        # Deny access to other .well-known paths
        location ^~ /.well-known/ {
            return 404;
        }

        # =================================================================
        # STATIC ASSETS AND PERFORMANCE
        # =================================================================
        # Favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        
        # Robots.txt
        location = /robots.txt {
            log_not_found off;
            access_log off;
            expires 7d;
        }
        
        # General static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            log_not_found off;
        }

        # =================================================================
        # ERROR HANDLING
        # =================================================================
        # Custom error pages
        error_page 400 401 403 404 /error/4xx.html;
        error_page 500 502 503 504 /error/5xx.html;
        
        location = /error/4xx.html {
            root /data/nginx/html;
            internal;
        }
        
        location = /error/5xx.html {
            root /data/nginx/html;
            internal;
        }
        
        # Fallback error pages
        location = /404.html {
            root /data/nginx/html;
            internal;
        }

        location = /50x.html {
            root /data/nginx/html;
            internal;
        }

        # =================================================================
        # MONITORING AND HEALTH CHECKS
        # =================================================================
        # Nginx status (restrict access)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # URLCheck container health check
        location /urlcheck-health {
            access_log off;
            proxy_pass http://127.0.0.1:8001/urlcheck/;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        # =================================================================
        # SECURITY RESTRICTIONS
        # =================================================================
        # Block common attack patterns
        location ~ /(\.|wp-|admin|phpmyadmin|xmlrpc) {
            return 444;
        }
        
        # Block certain user agents
        if ($http_user_agent ~* (wget|curl|libwww-perl|python|nikto|scan|perl|masscan|nmap)) {
            return 444;
        }
        
        # Block SQL injection and XSS attempts
        location ~ (\<|%3C).*script.*(\>|%3E) { return 444; }
        location ~ UNION.*SELECT.*\( { return 444; }
        location ~ base64_encode.*\( { return 444; }
        location ~ (\<|%3C).*object.*(\>|%3E) { return 444; }
        location ~ (\<|%3C).*iframe.*(\>|%3E) { return 444; }
    }

    # =================================================================
    # ADDITIONAL SERVER BLOCKS (if needed)
    # =================================================================
    
    # Redirect www to non-www (optional)
    server {
        listen 80;
        server_name www.dmseo03.dmcloudarchitect.com;
        return 301 http://dmseo03.dmcloudarchitect.com$request_uri;
    }
    
    # Default catch-all server (security)
    server {
        listen 80;
        server_name "";
        return 444;
    }
}

# =================================================================
# CONFIGURATION SUMMARY
# =================================================================
# 
# KEY CHANGES MADE:
# 
# ✅ URLCheck Proxy Configuration:
#    - Added proxy_pass to http://127.0.0.1:8001/urlcheck/
#    - Proper proxy headers for PHP application
#    - Rate limiting for security
#    - Special handling for login and API endpoints
# 
# ✅ Request Flow:
#    - /urlcheck/ → Proxy to localhost:8001 (Podman container)
#    - /          → Proxy to localhost:5678 (N8N)
# 
# ✅ Security Features:
#    - Enhanced rate limiting on login attempts
#    - Security headers maintained
#    - Attack pattern blocking
# 
# ✅ Health Checks:
#    - Added /urlcheck-health endpoint
#    - Tests connectivity to Podman container
# 
