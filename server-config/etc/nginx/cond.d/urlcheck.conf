# URLCheck Dashboard Configuration
# File: /etc/nginx/conf.d/urlcheck.conf
# Purpose: Proxy all /urlcheck/* requests to Podman container on localhost:8001
# 23:59

# URLCheck Dashboard Server Block
server {
    listen 80;
    server_name dmseo03.dmcloudarchitect.com;
    
    # Only handle /urlcheck/* requests in this server block
    location ^~ /urlcheck/ {
        # Separate logging for URLCheck requests
        access_log /var/log/nginx/urlcheck.log combined;
        error_log /var/log/nginx/urlcheck-error.log;
        
        # Rate limiting for dashboard
        limit_req zone=general burst=20 nodelay;
        
        # Debug headers to confirm this config is working
        add_header X-URLCheck-Config "SEPARATE-CONF" always;
        add_header X-Backend-Server "localhost:8001" always;
        
        # Proxy ALL /urlcheck/* requests to Podman container
        proxy_pass http://127.0.0.1:8001;
        
        # Essential proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # For handling redirects properly
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        
        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        
        # Buffering settings optimized for PHP/static assets
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        proxy_buffering on;
        
        # Security headers
        proxy_hide_header X-Powered-By;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Handle errors from upstream
        proxy_intercept_errors off;
    }
    
    # Handle exact /urlcheck (redirect to /urlcheck/)
    location = /urlcheck {
        return 301 $scheme://$host/urlcheck/;
    }
    
    # All other requests fall through to main server block
}