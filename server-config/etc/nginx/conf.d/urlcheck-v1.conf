# URL Check Application Configuration
# Handles /urlcheck-v1 path with PHP/HTML/CSS support
# Version: 1.0

server {
    listen 80;
    listen [::]:80;
    server_name dmseo03.dmcloudarchitect.com;

    # URL Check Application
    location /urlcheck-v1 {
        # Remove the /urlcheck-v1 prefix and serve from filesystem
        alias /data/nginx/html/urlcheck-v1;
        index index.php index.html index.htm;
        
        # Try files in order
        try_files $uri $uri/ @urlcheck_fallback;
        
        # Handle PHP files
        location ~ \.php$ {
            try_files $uri =404;
            
            # Security check
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            
            # Pass to PHP-FPM
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
            
            # PHP-FPM settings
            fastcgi_read_timeout 60s;
            fastcgi_intercept_errors on;
            fastcgi_hide_header X-Powered-By;
            
            # Security headers for PHP
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }
        
        # CSS files with proper MIME type
        location ~* \.css$ {
            add_header Content-Type "text/css" always;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            add_header Vary "Accept-Encoding" always;
            try_files $uri =404;
        }
        
        # JavaScript files
        location ~* \.js$ {
            add_header Content-Type "application/javascript" always;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            add_header Vary "Accept-Encoding" always;
            try_files $uri =404;
        }
        
        # Static assets (images, fonts, etc.)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            try_files $uri =404;
        }
        
        # Security: Deny access to sensitive files
        location ~* \.(conf|config|ini|sql|bak|backup|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # Fallback for URL Check app (handles routing)
    location @urlcheck_fallback {
        rewrite ^/urlcheck-v1/(.*)$ /urlcheck-v1/index.php?$1 last;
    }
}