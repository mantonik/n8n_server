# Development Report Server Configuration
# Domain: devreport.dmcloudarchitect.com
# Root: /data/nginx/html/dev/report
# Version: 1.0 - Development report server

server {
    listen 80;
    listen [::]:80;
    server_name devreport.dmcloudarchitect.com;
    
    # Document root for Report development
    root /data/nginx/html/dev/report;
    index index.php index.html index.htm;

    # Main location - serve files from root
    location / {
        try_files $uri $uri/ @report_fallback;
    }

    # PHP handler for Report application
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors on;
        fastcgi_hide_header X-Powered-By;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-App "Reports-Dev" always;
    }

    # Static assets optimization
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1d;  # Shorter cache for development
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
    }

    # Security: Deny access to sensitive files
    location ~* \.(conf|config|ini|sql|bak|backup|log|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to version control
    location ~ /\.(git|svn|hg) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Let's Encrypt certificate validation
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /data/nginx/letsencrypt;
    }

    # Fallback handler for Report routing
    location @report_fallback {
        rewrite ^/(.*)$ /index.php?$1 last;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /data/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /data/nginx/html;
        internal;
    }

    # Development logging (more verbose)
    access_log /var/log/nginx/devreport_access.log;
    error_log /var/log/nginx/devreport_error.log;
}