# Report Application Configuration
# Handles /report path - ready for future implementation
# Version: 1.0 - Initial placeholder config
# Version: 1.1 - Fixed alias PHP handling and SCRIPT_NAME parameter
# Version: 1.2 - Fixed alias with $request_filename for PHP-FPM

server {
    listen 80;
    listen [::]:80;
    server_name dmseo03.dmcloudarchitect.com;

    # Report Application - FIXED VERSION
    location /report {
        alias /data/nginx/html/report;
        index index.php index.html index.htm;
        
        # Try files first
        try_files $uri $uri/ @report_fallback;
        
        # Handle PHP files - CRITICAL: Use $request_filename with alias
        location ~ \.php$ {
            try_files $uri =404;
            
            # Pass to PHP-FPM with correct filename
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;
            
            # IMPORTANT: Use $request_filename instead of $document_root$fastcgi_script_name with alias
            fastcgi_param SCRIPT_FILENAME $request_filename;
            
            # Include other FastCGI params
            include fastcgi_params;
            
            # Override some params for alias
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            
            fastcgi_read_timeout 60s;
            fastcgi_intercept_errors on;
            fastcgi_hide_header X-Powered-By;
        }
        
        # Static files optimization
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }
        
        # Security
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~* \.(conf|config|ini|sql|bak|backup|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # Fallback for Report app
    location @report_fallback {
        rewrite ^/report/(.*)$ /report/index.php?$1 last;
    }
}