# N8N Server Configuration - Development Environment
# Domain: dmseo03.dmcloudarchitect.com  
# Purpose: Only N8N Docker container on localhost:5678
# Version: 1.0 - Clean N8N-only server
# Version: 1.1 - Updated for development environment structure

server {
    listen 80;
    listen [::]:80;
    server_name dmseo03.dmcloudarchitect.com;

    # N8N Application - Root path only (Docker container)
    location / {
        # Proxy to n8n docker container on localhost:5678
        proxy_pass http://127.0.0.1:5678;
        
        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for N8N
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts and buffering
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # N8N specific headers
        proxy_set_header X-Forwarded-Server $host;
        proxy_redirect off;
    }

    # Let's Encrypt certificate validation
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /data/nginx/letsencrypt;
    }

    # Security: Deny access to hidden files (just in case)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages (simple ones since this is N8N only)
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /data/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /data/nginx/html;
        internal;
    }

    # Logging for N8N
    access_log /var/log/nginx/n8n_access.log;
    error_log /var/log/nginx/n8n_error.log;
}