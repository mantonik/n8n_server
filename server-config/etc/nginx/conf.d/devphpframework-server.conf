# ========================================
# devphpframework-server.conf - Fixed Nginx Configuration
# Version: 1.1.0
# Created: 2025-07-01
# Framework: PHP Modular Development Framework
# Purpose: Corrected Nginx configuration for devphpframework.dmcloudarchitect.com
# Issues Fixed: Fallback routing, PHP handling, permissions
# ========================================

server {
    listen 80;
    listen [::]:80;
    server_name devphpframework.dmcloudarchitect.com;
    
    # Document root for PHP Framework development
    root /data/nginx/html/dev/devphpframework;
    index index.php index.html index.htm;

    # Enhanced logging for debugging
    access_log /var/log/nginx/devphpframework_access.log;
    error_log /var/log/nginx/devphpframework_error.log debug;

    # Main location - handle framework routing
    location / {
        # Try files first, then route everything through index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handler - CRITICAL FIX
    location ~ \.php$ {
        # Security check - only serve existing files
        try_files $uri =404;
        
        # FastCGI configuration
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Include standard FastCGI parameters
        include fastcgi_params;
        
        # Additional FastCGI parameters for framework
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        
        # Performance settings
        fastcgi_read_timeout 60s;
        fastcgi_intercept_errors on;
        fastcgi_hide_header X-Powered-By;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-App "devphpframework" always;
    }

    # Static assets optimization
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Vary "Accept-Encoding" always;
        try_files $uri =404;
        
        # Disable access logs for static files
        access_log off;
    }

    # Security: Deny access to sensitive files
    location ~* \.(conf|config|ini|sql|bak|backup|log|env)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security: Deny access to version control
    location ~ /\.(git|svn|hg) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Framework specific directories
    location ^~ /includes/ {
        deny all;
        return 404;
    }
    
    location ^~ /conf/ {
        deny all;
        return 404;
    }
    
    location ^~ /log/ {
        deny all;
        return 404;
    }

    # Let's Encrypt certificate validation
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /data/nginx/letsencrypt;
    }

    # Custom error pages
    error_page 404 /404.php;
    error_page 500 502 503 504 /50x.php;
    
    location = /404.php {
        root /data/nginx/html/dev/devphpframework;
        internal;
    }
    
    location = /50x.php {
        root /data/nginx/html/dev/devphpframework;
        internal;
    }
}