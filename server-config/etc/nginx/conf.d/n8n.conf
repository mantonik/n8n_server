# N8N Application Configuration
# Handles root path (/) and proxies to n8n docker container
# Version: 1.0

server {
    listen 80;
    listen [::]:80;
    server_name dmseo03.dmcloudarchitect.com;
    
    # Error pages from shared location
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /data/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /data/nginx/html;
        internal;
    }

    # N8N Application - Root path
    location / {
        # Proxy to n8n docker container
        proxy_pass http://127.0.0.1:5678;
        
        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts and buffering
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        # Buffer settings for better performance
        proxy_buffering off;
        proxy_cache off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Let's Encrypt certificate validation
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /data/nginx/letsencrypt;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}